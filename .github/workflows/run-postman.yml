name: Run Postman Collection

on:
  push:
    branches: [ "main" ] # Triggers automatically on push
  pull_request:
    branches: [ "main" ] # Triggers automatically on PR
  workflow_dispatch:     # Allows manual trigger via the GitHub UI (like clicking "Build Now" in Jenkins)

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test-api:
    runs-on: ubuntu-latest # Standard clean runner agent

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # LTS stable version for CI runners

      - name: Install Newman & Reporters
        # ➕ ADDED: newman-reporter-allure
        run: npm install newman newman-reporter-htmlextra newman-reporter-allure --legacy-peer-deps

      - name: Run Postman Collection
        run: |
          npx newman run "Booking_API_Workflow_postman_collection.json" \
            -r htmlextra,allure \
            --reporter-htmlextra-export index.html \
            --reporter-allure-export ./allure-results

      - name: Publish HTML Report (Artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Newman API Test Report
          path: index.html

      # ➕ ADDED: Uploads the raw Allure results folder as an artifact
      - name: Publish Allure Results (Artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ github.run_id }}
          path: ./allure-results/
          retention-days: 30

      - name: Setup Pages
        if: always()
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Tells GitHub to upload the folder containing your index.html

