name: Run Postman Collection

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test-api:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Newman, Reporters & Allure CLI
        run: npm install newman newman-reporter-htmlextra newman-reporter-allure allure-commandline --legacy-peer-deps

      - name: Run Postman Collection
        run: |
          npx newman run "Booking_API_Workflow_postman_collection.json" \
            -r htmlextra,allure \
            --reporter-htmlextra-export index.html \
            --reporter-allure-export ./allure-results

      - name: Generate Visual Allure Report
        if: always()
        run: npx allure generate ./allure-results --clean --single-file -o ./allure-report

      # ➕ ADDED: Places both HTML reports into a dedicated folder for GitHub Pages
      - name: Prepare Both Reports for GitHub Pages
        if: always()
        run: |
          mkdir -p ./pages-site
          cp index.html ./pages-site/index.html
          cp ./allure-report/index.html ./pages-site/allure.html

      - name: Publish Visual Allure Report (Artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-visual-report-${{ github.run_id }}
          path: ./pages-site/allure.html
          retention-days: 30

      - name: Publish HTML Report (Artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Newman API Test Report
          path: ./pages-site/index.html

      - name: Setup Pages
        if: always()
        uses: actions/configure-pages@v4

      # ➕ UPDATED: Uploads only the clean ./pages-site folder containing both URLs
      - name: Upload Pages Artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: './pages-site'

  deploy:
    needs: test-api
    if: always()
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

